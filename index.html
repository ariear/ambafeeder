<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmbaFeeder</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        padding: 14px 18px;
        background-color: #f8fafb;
        font-family: "Roboto", sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        font-size: 11px;
        margin-bottom: 24px;
      }
      .header h1 {
        margin-left: 10px;
      }

      .sub-header {
        margin-bottom: 18px;
      }
      .sub-header p:nth-child(1) {
        color: #40484e;
      }
      .sub-header p {
        font-weight: 500;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .sub-header h4 {
        font-size: 22px;
      }
      .sub-header-otomatis {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sub-header-otomatis button {
        background-color: #c8e6ff;
        padding: 12px 14px;
        border-radius: 12px;
        border: none;
      }

      .manual {
        background-color: #eaeaeb;
        padding: 18px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        margin-bottom: 28px;
      }
      .manual label {
        margin-bottom: 8px;
        font-weight: 500;
        color: #40484e;
      }
      .manual span {
        display: flex;
        background-color: white;
        padding: 18px;
        border-radius: 20px;
        margin-bottom: 24px;
      }
      .manual span input {
        width: 100%;
        border: none;
      }
      .manual button {
        background-color: #025f89;
        color: white;
        padding: 18px 0;
        border-radius: 20px;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
      }
      .manual svg {
        margin-right: 14px;
      }

      .schedule {
        background-color: white;
        padding: 20px;
        border-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .schedule .kiri {
        display: flex;
        align-items: center;
      }
      .schedule .kiri .icon {
        background-color: #acedda;
        padding: 9px 11px;
        border-radius: 80px;
      }
      .schedule .kiri .content {
        margin-left: 20px;
      }
      .schedule .kiri .content p:nth-child(1) {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .schedule .kiri .content p:nth-child(2) {
        font-size: 14px;
        font-weight: 400;
        color: #40484e;
      }

      .schedule .kanan button {
        background-color: transparent;
        border: 0px solid;
      }
      .schedule .kanan button:nth-child(1) {
        margin-right: 20px;
      }

      .timeline {
        position: relative;
        padding-left: 32px;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 8px;
        top: 18px;
        bottom: 18px;
        width: 2px;
        background: #d0d0d0;
      }
      .tl-item {
        position: relative;
        margin-bottom: 12px;
      }
      .tl-dot {
        position: absolute;
        left: -24px;
        top: 16px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #b0b0b0;
        border: 2px solid #d0d0d0;
      }
      .tl-item.active .tl-dot {
        background: #025f89;
        border-color: #025f89;
      }
      .tl-card {
        background: #F2F4F5;
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .tl-card .tl-time {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .tl-card .tl-desc {
        font-size: 13px;
        color: #40484e;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
      }
      .badge.auto {
        background: #d4eee7;
        color: #0f6e56;
      }
      .badge.manual {
        background: #dce5f0;
        color: #185fa5;
      }
    </style>
  </head>
